# One environment = a plan stage and an apply stage. Capacity name/resource group come from the
# environment's tfvars (Terraform creates the capacity). The pipeline resumes it before the plan
# and the apply (the Fabric provider refuses a paused capacity), and pauses it again afterwards only
# when the tfvars opt in with capacity_auto_pause = true.
#
# planAfter: the apply stage this environment's plan waits for (prod passes Apply_acc), so it is
# planned only after acc applied and sees what acc created (for example a new Fabric domain). On
# main it runs only when that apply succeeded; on a pull request or another branch the apply is
# skipped and the plan runs anyway.

parameters:
  - name: environment
    type: string
  - name: applyDependsOn
    type: object
    default: []
  - name: planAfter
    type: string
    default: ""

stages:
  - stage: Plan_${{ parameters.environment }}
    displayName: Plan ${{ parameters.environment }}
    ${{ if eq(parameters.planAfter, '') }}:
      dependsOn: []
    ${{ else }}:
      dependsOn: [${{ parameters.planAfter }}]
      condition: and(not(canceled()), or(ne(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest'), eq(dependencies.${{ parameters.planAfter }}.result, 'Succeeded')))
    variables:
      - group: fabricvending-${{ parameters.environment }}
    jobs:
      - job: plan
        steps:
          - checkout: self
          - template: ../steps/capacity.yml
            parameters:
              environment: ${{ parameters.environment }}
              action: resume
          - template: ../steps/terraform.yml
            parameters:
              environment: ${{ parameters.environment }}
              command: plan
          - template: ../steps/capacity.yml
            parameters:
              environment: ${{ parameters.environment }}
              action: suspend
          - publish: $(Build.SourcesDirectory)/workspace_vending/tfplan
            artifact: tfplan-${{ parameters.environment }}
            displayName: Publish plan

  - stage: Apply_${{ parameters.environment }}
    displayName: Apply ${{ parameters.environment }}
    dependsOn:
      - Plan_${{ parameters.environment }}
      - ${{ each dependency in parameters.applyDependsOn }}:
          - ${{ dependency }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: fabricvending-${{ parameters.environment }}
    jobs:
      - deployment: apply
        environment: fabricvending-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: cp "$(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan" "$(Build.SourcesDirectory)/workspace_vending/tfplan"
                  displayName: Stage saved plan

                - template: ../steps/capacity.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    action: resume

                - template: ../steps/terraform.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    command: apply

                - template: ../steps/capacity.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    action: suspend
