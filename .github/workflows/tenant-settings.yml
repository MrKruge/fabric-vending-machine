# Fabric tenant settings (tenant-wide), in their own stack and state. Runs only when the settings or
# the stack change. A pull request gets a plan; a push to main plans, then waits for a reviewer on the
# `global` GitHub environment before applying (when reviewers are configured on it).
# Nothing runs until parameters/tenant-settings/tenant-settings.tfvars exists, so pushing the
# repository as cloned is safe.
name: tenant-settings

on:
  push:
    branches: [main]
    paths: ["tenant_settings/**", "parameters/tenant-settings/**", ".github/workflows/tenant-settings.yml", ".github/actions/terraform/**"]
  pull_request:
    paths: ["tenant_settings/**", "parameters/tenant-settings/**", ".github/workflows/tenant-settings.yml", ".github/actions/terraform/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: fabric-vending-tenant-settings-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f parameters/tenant-settings/tenant-settings.tfvars ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No tenant settings governed yet::parameters/tenant-settings/tenant-settings.tfvars does not exist (see README, Tenant settings)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    if: needs.config.outputs.ready == 'true'
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform
        with:
          stack: tenant-settings
          environment: global
          command: plan
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          fabric-client-id: ${{ vars.FABRIC_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tfstate-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          tfstate-container: ${{ vars.TFSTATE_CONTAINER }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tfplan-tenant-settings
          path: tenant_settings/tfplan
          include-hidden-files: true

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-tenant-settings
          path: tenant_settings
      - uses: ./.github/actions/terraform
        with:
          stack: tenant-settings
          environment: global
          command: apply
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          fabric-client-id: ${{ vars.FABRIC_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tfstate-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          tfstate-container: ${{ vars.TFSTATE_CONTAINER }}
